name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    # Only the original repository deploys: a fork or a copy has no Firebase
    # project, and without this every push to it would end in a failed run.
    if: ${{ github.repository == 'shoujyo/lit-orbit' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIT_ORBIT }}
          channelId: live
          projectId: lit-orbit
